<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">

        <section class="weather-card">

            <div class="header">
                <h1>🌤 Weather Dashboard</h1>
                <p>Search for a city to view current weather</p>
            </div>

            <form id="searchForm" class="search-box">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                    autocomplete="off"
                >
                <button type="submit">Search</button>
            </form>

            <div id="message" class="message"></div>

            <section id="weatherResult" class="weather-result hidden">

                <div class="location">
                    <h2 id="cityName">Chennai</h2>
                    <p id="countryName"></p>
                </div>

                <div class="main-weather">

                    <div class="weather-icon" id="weatherIcon">
                        ☀️
                    </div>

                    <div>
                        <div class="temperature">
                            <span id="temperature">--</span>°C
                        </div>

                        <p id="weatherDescription">
                            Clear Sky
                        </p>
                    </div>

                </div>

                <div class="weather-details">

                    <div class="detail-card">
                        <span>🌡️</span>
                        <p>Feels Like</p>
                        <strong id="feelsLike">--°C</strong>
                    </div>

                    <div class="detail-card">
                        <span>💧</span>
                        <p>Humidity</p>
                        <strong id="humidity">--%</strong>
                    </div>

                    <div class="detail-card">
                        <span>💨</span>
                        <p>Wind Speed</p>
                        <strong id="windSpeed">-- km/h</strong>
                    </div>

                </div>

                <div class="updated">
                    Last updated: <span id="updatedTime">--</span>
                </div>

            </section>

        </section>

    </main>

    <script type="module" src="js/app.js"></script>

</body>
</html>
